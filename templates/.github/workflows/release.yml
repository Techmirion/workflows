# Caller of the shared `release` workflow (Techmirion/workflows, git.md 9).
# On every push to main: tag the merge commit, create the GitHub Release, and
# fast-forward dev (or open the sync PR).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: Techmirion/workflows/.github/workflows/release.yml@v1
    with:
      workflows-ref: v1
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
