# This repo's own release PR (see release-pr.yml).
name: self-release-pr

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, vMAJOR.MINOR.PATCH, above the last tag
        required: true
        type: string
      summary:
        description: A few words for the PR title
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    uses: ./.github/workflows/release-pr.yml
    with:
      version: ${{ inputs.version }}
      summary: ${{ inputs.summary }}
      workflows-repo: ${{ github.repository }}
      workflows-ref: ${{ github.sha }}
    secrets:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
      AUTOMATION_APP_KEY: ${{ secrets.AUTOMATION_APP_KEY }}
